[build-system]
requires = ["setuptools>=61.0.0", "wheel", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[bdist_wheel]
py_limited_api = "cp38"
[project]
name = "andi-ai"
version = "0.1.13"
description = "Agentic MongoDB NLP Database Interface"
readme = "README.md"
requires-python = ">=3.8"
license={text = "MIT" }
authors = [
    { name="Satish Kumar", email="satishlangayan@gmail.com" }
]
keywords = ["python", "agentic-ai", "mongodb", "nlp", "pymongo", "agents", "llms"]

dependencies = [
    "pymongo>=4.16.0",
    "certifi>=2024.0.0",
    "python-dotenv>=1.0.0"
]

classifiers = [
"Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]
