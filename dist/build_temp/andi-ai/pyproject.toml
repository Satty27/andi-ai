[project]
name = "andi-ai"
version = "0.1.0"
dependencies = [
    "pymongo>=4.16.0",
    "certifi>=2024.0.0",
    "python-dotenv>=1.0.0"
]

authors = [
  { name="Satish Kumar", email="satishlangayan@gmail.com" },
]
description = "ANDI: Advanced Natural Language Database Interface"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Satty27/andi-ai.git"